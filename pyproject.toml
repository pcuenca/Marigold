[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "marigold"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "torch>=1.13.0",
    "torchvision",
    "diffusers>=0.27.0",
    "transformers>=4.27.0",
    "pillow",
    "matplotlib",
    "scipy",
    "tqdm",
]

[tool.setuptools.packages.find]
include = ["marigold*"]
